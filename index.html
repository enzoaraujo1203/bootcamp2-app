<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Clima</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌤️ Painel do Clima</h1>
      <p>Consulte a previsão do tempo e salve suas cidades favoritas</p>
    </header>

    <main>
      <div class="search-box">
        <input type="text" id="campo-busca" placeholder="Digite o nome da cidade (ex: Brasília)...">
        <button id="botao-buscar">Buscar</button>
      </div>

      <div id="resultado" class="card-resultado hidden"></div>

      <section class="favoritos-section">
        <h2>⭐ Cidades Favoritas</h2>
        <ul id="lista-favoritos" class="lista-favoritos"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
